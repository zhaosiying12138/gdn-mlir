t-family="Consolas, Courier New, monospace" font-size="11" fill="#1c2733" font-weight="normal" text-anchor="start">create_async_groups</text><text x="329" y="207" font-family="Consolas, Courier New, monospace" font-size="11" fill="#1c2733" font-weight="normal" text-anchor="start">match scf.for</text><text x="329" y="239" font-family="Consolas, Courier New, monospace" font-size="11" fill="#1c2733" font-weight="normal" text-anchor="start">pipeline depth=2</text><rect x="640" y="52" width="230" height="250" rx="6" fill="#f0f7f0" stroke="#9db2c2" stroke-width="1.2"/><text x="654" y="78" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#1c2733" font-weight="bold" text-anchor="start">调度后的 payload</text><text x="654" y="111" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1c2733" font-weight="normal" text-anchor="start">A/B 双缓冲</text><text x="654" y="146" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1c2733" font-weight="normal" text-anchor="start">异步复制组</text><text x="654" y="181" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1c2733" font-weight="normal" text-anchor="start">K 循环 depth=2</text><text x="654" y="216" font-family="Consolas, Courier New, monospace" font-size="12" fill="#1c2733" font-weight="normal" text-anchor="start">peel_epilogue</text><line x1="270" y1="175" x2="315" y2="175" stroke="#5b6b7a" stroke-width="1.5" marker-end="url(#arr)"/><line x1="595" y1="175" x2="640" y2="175" stroke="#5b6b7a" stroke-width="1.5" marker-end="url(#arr)"/><text x="276" y="162" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#5b6b7a" font-weight="normal" text-anchor="start">handle</text><text x="598" y="162" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#5b6b7a" font-weight="normal" text-anchor="star