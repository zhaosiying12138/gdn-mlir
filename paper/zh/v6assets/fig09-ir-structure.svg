<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker></defs><text x="24" y="26" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#1c2733" font-weight="bold" text-anchor="start">IR 的两套结构：区域树与 SSA 的 use-def 边</text><rect x="20" y="48" width="385" height="310" rx="6" fill="#f7fafc" stroke="#9db2c2" stroke-width="1.2"/><text x="34" y="72" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#1c2733" font-weight="bold" text-anchor="start">真实 IR（节选）</text><text x="34" y="99" font-family="Consolas, Courier New, monospace" font-size="11" fill="#1c2733" font-weight="normal" text-anchor="start">func.func @smoke(%q, %k, %v, ...) {</text><text x="34" y="121" font-family="Consolas, Courier New, monospace" font-size="11" fill="#1c2733" font-weight="normal" text-anchor="start">  %o, %ht = &quot;gdn.fwd&quot;(%q, %k, %v, ...)</text><text x="34" y="143" font-family="Consolas, Courier New, monospace" font-size="11" fill="#1c2733" font-weight="normal" text-anchor="start">      &lt;{config = #gdn.config&lt;64, ...&gt;}&gt;</text><text x="34" y="165" font-family="Consolas, Courier New, monospace" font-size="11" fill="#1c2733" font-weight="normal" text-anchor="start">  return %o, %ht</text><text x="34" y="187" font-family="Consolas, Courier New, monospace" font-size="11" fill="#1c2733" font-weight="normal" text-anchor="start">}</text><text x="34" y="209" font-family="Consolas, Courier New, monospace" font-size="11" fill="#1c2733" font-weight="normal" text-anchor="start"></text><text x="34" y="231" font-family="Consolas, Courier New, monospace" font-size="11" fill="#1c2733" font-weight="normal" text-anchor="start">linalg.generic {</text><text x="34" y="253" font-family="Consolas, Courier New, monospace" font-size="11" fill="#1c2733" font-weight="normal" text-anchor="start">  ^bb0(%a, %b, %acc):</text><text x="34" y="275" font-family="Consolas, Courier New, monospace" font-size="11" fill="#1c2733" font-weight="normal" text-anchor="start">    %p = arith.mulf %a, %b</text><text x="34" y="297" font-family="Consolas, Courier New, monospace" font-size="11" fill="#1c2733" font-weight="normal" text-anchor="start">    %s = arith.addf %acc, %p</text><text x="34" y="319" font-family="Consolas, Courier New, monospace" font-size="11" fill="#1c2733" font-weight="normal" text-anchor="start">    linalg.yield %s</text><text x="34" y="341" font-family="Consolas, Courier New, monospace" font-size="11" fill="#1c2733" font-weight="normal" text-anchor="start">}</text><rect x="450" y="48" width="420" height="310" rx="6" fill="#ffffff" stroke="#9db2c2" stroke-width="1.2"/><text x="465" y="72" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#1c2733" font-weight="bold" text-anchor="start">包含关系</text><rect x="475" y="88" width="170" height="36" rx="6" fill="#eef4f9" stroke="#9db2c2" stroke-width="1.2"/><text x="490" y="111" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1c2733" font-weight="normal" text-anchor="start">module / func region</text><rect x="495" y="140" width="190" height="36" rx="6" fill="#eef4f9" stroke="#9db2c2" stroke-width="1.2"/><text x="510" y="163" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1c2733" font-weight="normal" text-anchor="start">block ^bb0</text><rect x="515" y="192" width="190" height="36" rx="6" fill="#eef4f9" stroke="#9db2c2" stroke-width="1.2"/><text x="530" y="215" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1c2733" font-weight="normal" text-anchor="start">gdn.fwd（Operation）</text><line x1="560" y1="124" x2="560" y2="140" stroke="#5b6b7a" stroke-width="1.5"/><line x1="580" y1="176" x2="580" y2="192" stroke="#5b6b7a" stroke-width="1.5"/><text x="470" y="260" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#1c2733" font-weight="bold" text-anchor="start">use-def（另一套边）</text><text x="480" y="286" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1c2733" font-weight="normal" text-anchor="start">%q  ───────────────▶  gdn.fwd</text><text x="480" y="312" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1c2733" font-weight="normal" text-anchor="start">%o   ───────────────▶  return</text><text x="480" y="338" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1c2733" font-weight="normal" text-anchor="start">%p   ───────────────▶  arith.addf</text><text x="24" y="390" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#5b6b7a" font-weight="normal" text-anchor="start">操作数/结果/属性属于 Operation；region 包含 block，block 包含操作。SSA 的定义—使用关系沿另一套边连接。</text><text x="24" y="414" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#5b6b7a" font-weight="normal" text-anchor="start">memref 的 SSA 句柄唯一，不代表其指向的内存不可写；别名与副作用需要另行分析。</text></svg>