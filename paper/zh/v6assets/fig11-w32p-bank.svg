<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 395" role="img"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7a"/></marker></defs><text x="24" y="26" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#1c2733" font-weight="bold" text-anchor="start">W32P：让两个半 warp 落在互补的 16 个 bank 上</text><text x="28" y="56" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#1c2733" font-weight="normal" text-anchor="start">row = 8·(i &gt;&gt; 7) + warp + 4·(lane ≥ 16)      col = 2·(lane mod 16)</text><text x="28" y="84" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#5b6b7a" font-weight="normal" text-anchor="start">F2 tile：行距 80 B = 20 个字；bank = 字地址 mod 32；80 mod 32 = 16</text><text x="28" y="124" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#0f5a8a" font-weight="bold" text-anchor="start">lane 0–15：行 r</text><text x="28" y="151" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1c2733" font-weight="normal" text-anchor="start">地址 [20r, 20r+15]</text><text x="28" y="184" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#b06020" font-weight="bold" text-anchor="start">lane 16–31：行 r+4</text><text x="28" y="211" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="12" fill="#1c2733" font-weight="normal" text-anchor="start">地址 [20r+80, 20r+95]</text><rect x="310" y="118" width="23" height="42" rx="2" fill="#8bbbd6" stroke="#ffffff" stroke-width="1"/><text x="321.5" y="144" font-family="Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif" font-size="11" fill="#1c2733" font-weight="normal" text-anchor="middle">0</text><rect x="335" y="118" width="23" height="42" rx="2" fill="#8